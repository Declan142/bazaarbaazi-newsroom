name: Confirm Premier League results

on:
  schedule:
    - cron: '47 23 * * *'
  workflow_dispatch:

concurrency:
  group: football-results-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out current published results
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Restore reduced public source records
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _runtime/open-football-inputs
          key: football-inputs-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: football-inputs-v1-
      - name: Test source decisions and standings
        run: python3 -m unittest discover -s examples/football-results -q
      - name: Check community sources and confirmed scores
        run: |
          set -o pipefail
          python3 examples/football-results/refresh.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Render the public table for readers without scripts
        run: python3 examples/football-results/render_table.py
      - name: Publish the verified data and readable table together
        run: |
          git add -- examples/football-results/snapshot.json examples/football-results/standings.md
          if git diff --cached --quiet; then
            echo 'No confirmed changes. Kept both published files.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update independently confirmed Premier League results'
          git push origin HEAD:main
